name: Sync WinGet Manifest Hash
description: Sets InstallerSha256 in the generated WinGet manifests to the digest of the released asset

inputs:
  repository:
    description: Repository holding the release, in owner/name form
    required: true
  tag:
    description: Release tag holding the asset (e.g. v1.2.3)
    required: true
  version:
    description: Version number (without v prefix)
    required: true
  target:
    description: Runtime identifier the asset was built for (e.g. win-x64)
    required: true
  file-type:
    description: Extension of the released asset (e.g. msi)
    required: true
  manifest-path:
    description: Path to the directory containing the WinGet manifests
    required: true
  token:
    description: Token used to read the release from the GitHub API
    required: true

runs:
  using: composite
  steps:
    - name: Sync manifest hash
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ inputs.repository }}/releases/tags/${{ inputs.tag }}" -Headers @{
            Accept        = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
        }
        $pattern = "*${{ inputs.version }}-${{ inputs.target }}.${{ inputs.file-type }}"
        $asset = $release.assets | Where-Object { $_.name -like $pattern } | Select-Object -First 1
        if (-not $asset) { throw "Release ${{ inputs.tag }} has no asset matching $pattern." }
        if (-not $asset.digest) { throw "Asset $($asset.name) has no digest; it predates GitHub's asset digest field." }
        $hash = ($asset.digest -replace '^sha256:', '').ToUpper()
        Get-ChildItem -Path "${{ inputs.manifest-path }}" -Recurse -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace 'InstallerSha256:\s*[A-Fa-f0-9]+', "InstallerSha256: $hash" | Set-Content $_.FullName
        }
