name: Resolve Release Asset
description: Finds a released asset and reports its download URL and digest

inputs:
  repository:
    description: Repository holding the release, in owner/name form
    required: true
  tag:
    description: Release tag holding the asset (e.g. v1.2.3)
    required: true
  version:
    description: Version number (without v prefix)
    required: true
  target:
    description: Runtime identifier the asset was built for (e.g. win-x64)
    required: true
  file-type:
    description: Extension of the released asset (e.g. msi)
    required: true
  token:
    description: Token used to read the release from the GitHub API
    required: true

outputs:
  name:
    description: File name of the released asset
    value: ${{ steps.asset.outputs.name }}
  url:
    description: Download URL of the released asset
    value: ${{ steps.asset.outputs.url }}
  sha256:
    description: Uppercase SHA256 digest of the released asset
    value: ${{ steps.asset.outputs.sha256 }}

runs:
  using: composite
  steps:
    - name: Resolve release asset
      id: asset
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        $headers = @{
            Accept                 = 'application/vnd.github+json'
            Authorization          = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'cursor-installer-creator-ci'
        }
        $uri = 'https://api.github.com/repos/${{ inputs.repository }}/releases/tags/${{ inputs.tag }}'
        $pattern = '*${{ inputs.version }}-${{ inputs.target }}.${{ inputs.file-type }}'

        $asset = $null
        foreach ($attempt in 1..3) {
            $release = Invoke-RestMethod -Uri $uri -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -like $pattern } | Select-Object -First 1
            if (-not $asset) { throw "Release ${{ inputs.tag }} has no asset matching $pattern." }
            if ($asset.digest) { break }
            Start-Sleep -Seconds 5
        }
        if (-not $asset.digest) {
            throw "Asset $($asset.name) has no digest; it predates GitHub's asset digest field."
        }

        "name=$($asset.name)" >> $env:GITHUB_OUTPUT
        "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
        "sha256=$(($asset.digest -replace '^sha256:', '').ToUpperInvariant())" >> $env:GITHUB_OUTPUT
