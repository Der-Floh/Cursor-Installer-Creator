name: Create ZIP Archive
description: Creates a high-compression ZIP archive from a publish output directory

inputs:
  name:
    description: Base name of the archive, without version or target
    required: true
  version:
    description: Version number (without v prefix)
    required: true
  target:
    description: Runtime identifier the archive is built for (e.g. win-x64)
    required: true
  source-path:
    description: Directory whose contents are archived
    required: true
  output-dir:
    description: Directory the archive is written to
    required: true

outputs:
  archive-path:
    description: Absolute path of the created archive
    value: ${{ steps.zip.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Create ZIP
      id: zip
      shell: pwsh
      run: |
        $dir = [IO.Path]::GetFullPath([IO.Path]::Combine($env:GITHUB_WORKSPACE, '${{ inputs.output-dir }}'))
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $archive = Join-Path $dir '${{ inputs.name }}-v${{ inputs.version }}-${{ inputs.target }}.zip'
        "archive-path=$archive" >> $env:GITHUB_OUTPUT
        7z a -tzip -mx=9 $archive '${{ inputs.source-path }}/*'
