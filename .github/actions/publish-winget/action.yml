name: Publish to WinGet
description: Submits the generated WinGet manifests to microsoft/winget-pkgs

inputs:
  manifest-path:
    description: Path to the directory containing the WinGet manifests
    required: true
  token:
    description: GitHub PAT for submitting PR to microsoft/winget-pkgs
    required: true
  wingetcreate-version:
    description: Release tag of microsoft/winget-create to use
    required: false
    default: v1.12.13.0
  wingetcreate-sha256:
    description: Expected SHA256 of wingetcreate.exe for the pinned version
    required: false
    default: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA

runs:
  using: composite
  steps:
    - name: Download wingetcreate
      shell: pwsh
      run: |
        $exe = Join-Path $env:TEMP 'wingetcreate.exe'
        $uri = 'https://github.com/microsoft/winget-create/releases/download/${{ inputs.wingetcreate-version }}/wingetcreate.exe'
        Invoke-WebRequest -Uri $uri -OutFile $exe
        $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
        if ($actual -ne '${{ inputs.wingetcreate-sha256 }}') {
            Remove-Item $exe -Force
            throw "wingetcreate.exe SHA256 mismatch: expected ${{ inputs.wingetcreate-sha256 }}, got $actual."
        }

    - name: Submit manifests to WinGet
      shell: pwsh
      env:
        WINGET_CREATE_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        if (-not (Test-Path -Path '${{ inputs.manifest-path }}')) { throw "Manifest path not found: ${{ inputs.manifest-path }}" }
        & (Join-Path $env:TEMP 'wingetcreate.exe') submit --no-open '${{ inputs.manifest-path }}'
