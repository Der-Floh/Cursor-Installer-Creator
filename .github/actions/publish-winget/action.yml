name: Publish to WinGet
description: Submits the generated WinGet manifests to microsoft/winget-pkgs

inputs:
  manifest-path:
    description: Path to the directory containing the WinGet manifests
    required: true
  token:
    description: GitHub PAT for submitting PR to microsoft/winget-pkgs
    required: true

runs:
  using: composite
  steps:
    - name: Download wingetcreate
      shell: pwsh
      run: Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe" -OutFile "$env:TEMP\wingetcreate.exe"

    - name: Submit manifests to WinGet
      shell: pwsh
      env:
        WINGET_CREATE_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        if (-not (Test-Path -Path "${{ inputs.manifest-path }}")) { throw "Manifest path not found: ${{ inputs.manifest-path }}" }
        & "$env:TEMP\wingetcreate.exe" submit "${{ inputs.manifest-path }}"
