name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: winget-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj
  PUBLISH_PROFILE: winx64
  PUBLISH_PATH: Cursor_Installer_Creator.Desktop/bin/Publish
  AIP_PATH: .github/CursorInstallerCreator.aip
  ARTIFACTS_PATH: artifacts
  MANIFEST_ARTIFACT: winget-manifests
  WINGET_PACKAGE_ID: Der_Floh.CursorInstallerCreator
  PACKAGE_NAME: CursorInstallerCreator
  PRODUCT_NAME: Cursor Installer Creator
  TARGET: win-x64
  FILE_TYPE: msi

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          value="${TAG#v}"
          if [[ ! "$value" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::'$TAG' is not a version tag."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -p:PublishProfile=${{ env.PUBLISH_PROFILE }}
          -p:Version=${{ steps.version.outputs.value }}
          -clp:ForceConsoleColor

      - name: Create MSI
        id: msi
        uses: ./.github/actions/create-msi
        with:
          aip-path: ${{ env.AIP_PATH }}
          version: ${{ steps.version.outputs.value }}
          output-dir: ${{ env.ARTIFACTS_PATH }}
          advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}

      - name: Verify MSI
        uses: ./.github/actions/verify-msi
        with:
          installer-path: ${{ steps.msi.outputs.installer-path }}
          product-name: ${{ env.PRODUCT_NAME }}
          version: ${{ steps.version.outputs.value }}

      - name: Create ZIP
        uses: ./.github/actions/create-zip
        with:
          name: ${{ env.PACKAGE_NAME }}
          version: ${{ steps.version.outputs.value }}
          target: ${{ env.TARGET }}
          source-path: ${{ env.PUBLISH_PATH }}
          output-dir: ${{ env.ARTIFACTS_PATH }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./${{ env.ARTIFACTS_PATH }}/*.zip
            ./${{ env.ARTIFACTS_PATH }}/*.msi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./${{ env.ARTIFACTS_PATH }}/*.msi
            ./${{ env.ARTIFACTS_PATH }}/*.zip

      - name: Resolve release asset
        id: asset
        uses: ./.github/actions/resolve-release-asset
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name }}
          version: ${{ steps.version.outputs.value }}
          target: ${{ env.TARGET }}
          file-type: ${{ env.FILE_TYPE }}
          token: ${{ github.token }}

      - name: Verify WinGet manifest
        uses: ./.github/actions/verify-manifest
        with:
          manifest-path: ${{ steps.msi.outputs.manifest-dir }}
          installer-url: ${{ steps.asset.outputs.url }}
          installer-sha256: ${{ steps.asset.outputs.sha256 }}

      - name: Archive WinGet manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANIFEST_ARTIFACT }}
          path: ${{ steps.msi.outputs.manifest-dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Resolve WinGet submission mode
        id: winget
        if: ${{ !github.event.release.prerelease }}
        uses: ./.github/actions/resolve-winget-mode
        with:
          package-id: ${{ env.WINGET_PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}
          token: ${{ github.token }}

      - name: Create WinGet package
        if: ${{ steps.winget.outputs.mode == 'create' }}
        uses: ./.github/actions/winget-publish
        with:
          manifest-path: ${{ steps.msi.outputs.manifest-dir }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

      - name: Update WinGet package
        if: ${{ steps.winget.outputs.mode == 'update' }}
        uses: ./.github/actions/winget-update
        with:
          package-id: ${{ env.WINGET_PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}
          installer-url: ${{ steps.asset.outputs.url }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
