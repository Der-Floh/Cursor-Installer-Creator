name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_VERSION: "10.0.x"
  DESKTOP_PROJECT: Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj
  PUBLISH_PROFILE: winx64

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            project: Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj
            wasm: false
          - name: web
            project: Cursor_Installer_Creator.Browser/Cursor_Installer_Creator.Browser.csproj
            wasm: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools
        if: matrix.wasm
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore ${{ matrix.project }} -clp:ForceConsoleColor

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release --no-restore -clp:ForceConsoleColor

  publish-desktop:
    name: Publish desktop (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish ${{ env.DESKTOP_PROJECT }}
          -p:PublishProfile=${{ env.PUBLISH_PROFILE }}
          -clp:ForceConsoleColor
