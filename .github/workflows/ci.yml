name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Der-Floh/Der-Floh/.github/workflows/app-ci.yml@v1
    with:
      projects: >-
        [
        {"name": "desktop", "project": "Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj", "wasm": false},
        {"name": "web", "project": "Cursor_Installer_Creator.Browser/Cursor_Installer_Creator.Browser.csproj", "wasm": true}
        ]
      publish-project: Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj
      publish-profile: winx64
      author: Der_Floh
      package-name: CursorInstallerCreator
      splash-image: Cursor_Installer_Creator/Assets/icon-x256.png

  automerge:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge Dependabot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
