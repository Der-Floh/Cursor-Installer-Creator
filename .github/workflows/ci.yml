name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-desktop:
    name: Build desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj -clp:ForceConsoleColor

      - name: Build
        run: dotnet build Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj -c Release --no-restore -clp:ForceConsoleColor

  build-web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Cursor_Installer_Creator.Browser/Cursor_Installer_Creator.Browser.csproj -clp:ForceConsoleColor

      - name: Build
        run: dotnet build Cursor_Installer_Creator.Browser/Cursor_Installer_Creator.Browser.csproj -c Release --no-restore -clp:ForceConsoleColor
