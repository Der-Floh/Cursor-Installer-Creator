name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: Cursor_Installer_Creator.Desktop/Cursor_Installer_Creator.Desktop.csproj
  PUBLISH_PROFILE: winx64
  AIP_PATH: .github/CursorInstallerCreator.aip
  ARTIFACTS_PATH: artifacts
  MANIFEST_PATH: artifacts/manifests/d/Der_Floh/CursorInstallerCreator
  TARGET: win-x64
  FILE_TYPE: msi

jobs:
  publish-winget:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "value=$(echo '${{ inputs.tag }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -p:PublishProfile=${{ env.PUBLISH_PROFILE }}
          -p:Version=${{ steps.version.outputs.value }}
          -clp:ForceConsoleColor

      - name: Create MSI
        uses: ./.github/actions/create-msi
        with:
          aip-path: ${{ env.AIP_PATH }}
          version: ${{ steps.version.outputs.value }}
          output-dir: ${{ env.ARTIFACTS_PATH }}
          advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}

      - name: Sync manifest hash with released MSI
        uses: ./.github/actions/sync-manifest-hash
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          version: ${{ steps.version.outputs.value }}
          target: ${{ env.TARGET }}
          file-type: ${{ env.FILE_TYPE }}
          manifest-path: ${{ env.MANIFEST_PATH }}/${{ steps.version.outputs.value }}
          token: ${{ github.token }}

      - name: Publish to WinGet
        uses: ./.github/actions/publish-winget
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}/${{ steps.version.outputs.value }}
          token: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
