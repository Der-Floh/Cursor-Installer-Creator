version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      avalonia:
        patterns:
          - Avalonia
          - Avalonia.*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      nuget:
        patterns:
          - "*"
